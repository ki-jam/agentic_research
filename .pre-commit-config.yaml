repos:
  # ── Linting ─────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── Tests ───────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # Uses the `python` on your PATH — activate your venv before committing.
        entry: python -m pytest tests/ -q --tb=short
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
